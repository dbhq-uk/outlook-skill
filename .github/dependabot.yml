version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # The live half is bash calling the Azure CLI, curl and jq, and pins nothing.
  # outlook-to-md has a few small Python dependencies (html2text, dateutil,
  # tqdm). Grouped into one pull request so they move together, and CI runs the
  # suite on 3.9 to 3.13 against whatever a bump brings in.
  - package-ecosystem: pip
    directory: /skills/outlook-to-md
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
    groups:
      archive:
        patterns:
          - "*"
