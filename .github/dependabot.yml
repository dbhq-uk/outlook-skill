version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # The live half is bash calling the Azure CLI, curl and jq, and pins nothing.
  # outlook-to-md does have real dependencies, and they are the awkward kind:
  # libratom pulls a transitive numpy that only resolves on Python 3.9 to 3.11,
  # so a bump here can break the install on the interpreters this skill
  # deliberately supports. Grouped into one pull request because the pins move
  # together, and opened at all because a silent drift in libratom is how the
  # PST backend stops installing.
  - package-ecosystem: pip
    directory: /skills/outlook-to-md
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
    groups:
      archive:
        patterns:
          - "*"
