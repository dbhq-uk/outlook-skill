name: Validate

on:
  push:
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version` in plugin.json, on purpose (24 Sep 2026). Claude Code only
      # updates an installed plugin when this field changes, it was never bumped,
      # and marketplace installs sat on old code for weeks. With no version the
      # commit is the version, so every merge to main reaches users.
      - name: plugin.json carries no version
        run: jq -e 'has("version") | not' .claude-plugin/plugin.json > /dev/null

      - name: Validate plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Check shell scripts parse
        # Root installers included: they grew per-skill dependency logic when the
        # repo became a pack, and a syntax error there breaks every install.
        run: |
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "Syntax error: $s"; fail=1; }
          done < <({ find . -maxdepth 1 -name '*.sh'; find skills -name '*.sh'; })
          exit $fail

      - name: Check Python scripts parse
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" \
              || { echo "Syntax error: $f"; fail=1; }
          done < <(find skills -name '*.py')
          exit $fail

      # md_to_html shells out to pandoc, and the suite SKIPS its tests when pandoc
      # is absent. The runner has no pandoc, so without this those assertions would
      # quietly not run - and md_to_html builds the HTML body of every email the
      # skill sends. A skipped test in a green build is the bug we are fixing here.
      - name: Install pandoc (required by the md_to_html tests)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pandoc

      # The suites are offline: they extract the real functions from the scripts
      # and exercise them against a mocked api_call, so no account or network is
      # needed. Discovered rather than listed, so a new *_test.sh is picked up.
      - name: Run unit tests
        run: |
          fail=0
          found=0
          skipped=0
          while IFS= read -r t; do
            found=1
            echo "::group::$t"
            out=$(bash "$t" 2>&1) || fail=1
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -q '^skip - '; then skipped=1; fi
            echo "::endgroup::"
          done < <(find skills -name '*_test.sh' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::No test suites found - the runner is not testing anything."
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::error::A suite skipped tests (missing dependency). CI must install it and run them."
            fail=1
          fi
          exit $fail

      - name: Check SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not m:
                  print(f"{skill}: missing YAML frontmatter"); ok = False; continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(.+)$", fm, re.M)
              desc = re.search(r"^description:\s*(.+)$", fm, re.M)
              if not name:
                  print(f"{skill}: missing 'name'"); ok = False
              else:
                  name = name.group(1).strip()
                  if name != skill.parent.name:
                      print(f"{skill}: name '{name}' != directory '{skill.parent.name}'"); ok = False
                  if not re.fullmatch(r"[a-z0-9-]{1,64}", name):
                      print(f"{skill}: name must be lowercase alphanumeric/hyphen, <=64 chars"); ok = False
              if not desc:
                  print(f"{skill}: missing 'description'"); ok = False
              elif len(desc.group(1).strip()) > 1024:
                  print(f"{skill}: description exceeds 1024 chars"); ok = False
          sys.exit(0 if ok else 1)
          PY

  outlook-to-md:
    name: outlook-to-md (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Hard 3.9 floor: parse_email_address annotates `tuple[str, str]` at
        # runtime with no `from __future__ import annotations`, so PEP 585
        # builtin generics must exist for the module to import at all.
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        working-directory: skills/outlook-to-md
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt

      - name: Run test suite
        working-directory: skills/outlook-to-md
        run: python -m pytest tests/ -v -p no:cacheprovider

  # A real PST, converted end to end, on the newest Python the matrix runs. The
  # suite above stubs readpst; this job proves the whole path: readpst from
  # pst-utils, the .eml tree it writes, and the archive that comes out.
  #
  # The PST is the public Enron sample that pst-extractor (MIT) ships as test
  # data. It is fetched at a pinned commit and checked against its hash, so it
  # cannot change under the test. It holds about 70 messages in 5 folders, most
  # with an attachment. The exact count readpst recovers varies by one or two
  # between pst-utils builds, so the floors below leave room for that and no
  # more: a backend that loses messages or attachments still fails.
  outlook-to-md-pst:
    name: outlook-to-md (real PST, py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install readpst (pst-utils)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pst-utils
          readpst -V | head -1

      - name: Install the documented requirements
        working-directory: skills/outlook-to-md
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch the sample PST
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/enron.pst" \
            "https://raw.githubusercontent.com/epfromer/pst-extractor/7d08ef9bc7112c23275fa948306c76bba6e24fba/src/__tests__/testdata/enron.pst"
          echo "6152489de3472be6f1f840935d34b6dbf5f62b025dd015929ea9cf66eb5a5b46  $RUNNER_TEMP/enron.pst" | sha256sum -c -

      - name: Convert it, then check the emails, folders and attachments
        run: |
          python skills/outlook-to-md/scripts/outlook_to_md.py "$RUNNER_TEMP/enron.pst" "$RUNNER_TEMP/archive"
          python - "$RUNNER_TEMP/archive" <<'PY'
          import csv, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          with open(out / "index.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          folders = {r["pst_folder"] for r in rows}
          attachments = sum(int(r["attachment_count"]) for r in rows)
          log = (out / "extraction_log.txt").read_text()
          print(f"{len(rows)} emails, {len(folders)} folders, {attachments} attachments")
          assert len(rows) >= 68, f"expected about 70 emails, got {len(rows)}"
          assert len(folders) == 5, f"expected 5 folders, got {sorted(folders)}"
          assert attachments >= 55, f"expected about 60 attachments or more, got {attachments}"
          assert "  Errors: 0" in log, log
          assert len(list((out / "emails").rglob("email.md"))) == len(rows)
          PY

  # THE SAME TWO LINTERS IN EVERY DBHQ SKILL REPO, added 17 Sep 2026. Nine of
  # the fourteen ran no linter at all, in an estate that is mostly bash and
  # Python - so a shell quoting hazard or a name that does not exist was only
  # caught by somebody reading the diff.
  #
  # IT IS A DELIBERATELY NARROW RUFF SELECTION. `E9` is syntax errors and
  # `F` is the pyflakes set: undefined names, unused imports, f-strings with no
  # placeholders. Those are bugs. The full default selection flags import order
  # and whitespace across every one of these repos, which would have meant
  # reformatting thousands of lines in code other sessions are working in
  # before the gate could go green - a large diff to buy a gate that catches
  # less than this one does. garmin and imager run the full ruff and keep it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        # -S warning, not the default, because `info` and `style` fire on
        # idioms these scripts use deliberately. xargs -r so a repo with no
        # shell scripts is a pass rather than a shellcheck usage error.
        run: |
          find . -name '*.sh' -not -path '*/.venv/*' -print0 \
            | xargs -0 -r shellcheck -S warning

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"

      - name: ruff - syntax errors and undefined names
        run: |
          pip install --quiet ruff
          ruff check . --select E9,F --exclude .venv
